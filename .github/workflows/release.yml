name: Release

# Triggered by pushing a tag like `v0.2.0`. Builds a binary per platform,
# packages each as deepseek-axi-<target>.tar.gz, and attaches them to a
# GitHub Release for that tag. This is what `deepseek-axi update`
# (src/commands/update.rs, via the `self_update` crate) and install.sh both
# download from — the asset naming here (bin name + Rust target triple) is
# exactly what self_update's target-matching expects.
on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: deepseek-axi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --verbose

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the same Apple Silicon runner rather than
          # run on a dedicated Intel-Mac (macos-13) runner: GitHub's hosted
          # Intel-Mac pool is unreliable/exhausted (a real run here sat
          # queued for 1+ hour while every other job finished in minutes),
          # and Xcode's toolchain cross-compiles both slices natively, so
          # there's no need to depend on that pool at all.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          asset="${BIN_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" "$BIN_NAME"
          shasum -a 256 "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
