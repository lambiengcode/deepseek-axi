<svg xmlns="http://www.w3.org/2000/svg" width="620" height="410" viewBox="0 0 620 410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>deepseek-axi: raw DeepSeek API call vs deepseek-axi, median latency (log scale)</title>
  <rect width="620" height="410" fill="#ffffff"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">
    Raw API call vs deepseek-axi — median latency (log scale, N=5 live calls each)
  </text>

  <!-- axis -->
  <line x1="70" y1="290" x2="580" y2="290" stroke="#888" stroke-width="1"/>
  <text x="18" y="210" font-size="11" fill="#555" text-anchor="middle" transform="rotate(-90 18 210)">ms (log scale)</text>

  <!-- log-scale gridlines: 1,000 / 10,000 / 100,000 ms -->
  <g stroke="#eee" stroke-width="1">
    <line x1="70" y1="258.6" x2="580" y2="258.6"/>
    <line x1="70" y1="154.3" x2="580" y2="154.3"/>
    <line x1="70" y1="50"    x2="580" y2="50"/>
  </g>
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="65" y="262">1,000ms</text>
    <text x="65" y="158">10,000ms</text>
    <text x="65" y="54">100,000ms</text>
  </g>

  <!-- Group 1: ask (simple Q&A, flash) -->
  <g>
    <rect x="140" y="249.9" width="55" height="40.1" fill="#C0392B"/>
    <rect x="205" y="248.3" width="55" height="41.7" fill="#2E8B57"/>
    <text x="167" y="244" text-anchor="middle" font-size="11" fill="#1a1a1a">1212ms</text>
    <text x="232" y="243" text-anchor="middle" font-size="11" fill="#1a1a1a">1256ms</text>
    <text x="200" y="310" text-anchor="middle" font-size="12" fill="#333">ask</text>
    <text x="200" y="325" text-anchor="middle" font-size="10" fill="#999">no meaningful difference</text>
  </g>

  <!-- Group 2: review (thinking-on free prose vs thinking-off forced JSON) -->
  <g>
    <rect x="380" y="67.1"  width="55" height="222.9" fill="#C0392B"/>
    <rect x="445" y="231.1" width="55" height="58.9"  fill="#2E8B57"/>
    <text x="407" y="62" text-anchor="middle" font-size="11" fill="#1a1a1a">68,542ms</text>
    <text x="472" y="226" text-anchor="middle" font-size="11" fill="#1a1a1a">1837ms</text>
    <text x="440" y="310" text-anchor="middle" font-size="12" fill="#333">review</text>
    <text x="440" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#2E8B57">37.3x faster, 42.9x cheaper</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <rect x="190" y="350" width="14" height="14" fill="#C0392B"/>
    <text x="210" y="361">raw API call (thinking on, free-form prompt)</text>
    <rect x="190" y="370" width="14" height="14" fill="#2E8B57"/>
    <text x="210" y="381">deepseek-axi (thinking off, exact payload the CLI sends)</text>
  </g>
  <text x="310" y="402" text-anchor="middle" font-size="10" fill="#999">
    Measured 2026-08-14, deepseek-v4-flash — see bench/results/raw-vs-axi.md for full data and methodology
  </text>
</svg>
